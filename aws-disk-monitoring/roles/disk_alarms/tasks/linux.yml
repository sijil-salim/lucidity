---
- name: Build list of real, monitored mounts from facts
  ansible.builtin.set_fact:
    _mounts: >-
      {{ ansible_facts.mounts
         | rejectattr('fstype', 'in', disk_ignore_fstypes)
         | rejectattr('size_total', 'equalto', 0)
         | rejectattr('mount', 'match', disk_ignore_mount_regex)
         | list }}

- name: "Threshold alarms: disk_used_percent (warning / critical)"
  amazon.aws.cloudwatch_metric_alarm:
    state: present
    region: "{{ ansible_aws_ssm_region }}"
    profile: "{{ ansible_aws_ssm_profile }}"
    name: "{{ disk_alarm_prefix }}-{{ item.1.level }}-{{ inventory_hostname }}-{{ item.0.mount | regex_replace('[^A-Za-z0-9]', '_') }}"
    description: "{{ item.1.level | upper }}: {{ item.0.mount }} on {{ inventory_hostname }} ({{ aws_account_name }}) >= {{ item.1.percent }}% used"
    namespace: CWAgent
    metric_name: disk_used_percent
    statistic: Maximum
    comparison: GreaterThanOrEqualToThreshold
    threshold: "{{ item.1.percent }}"
    period: "{{ item.1.period | default(60) }}"
    evaluation_periods: "{{ item.1.evaluation_periods | default(2) }}"
    datapoints_to_alarm: "{{ item.1.datapoints_to_alarm | default(item.1.evaluation_periods | default(2)) }}"
    treat_missing_data: missing
    dimensions:
      InstanceId: "{{ inventory_hostname }}"
      path: "{{ item.0.mount }}"
      fstype: "{{ item.0.fstype }}"
    alarm_actions: "{{ [alerts_topic_arn] if alerts_topic_arn else [] }}"
    ok_actions: "{{ [alerts_topic_arn] if alerts_topic_arn else [] }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  loop: "{{ _mounts | product(disk_thresholds) | list }}"
  loop_control:
    label: "{{ item.0.mount }} / {{ item.1.level }}"

# Catches the disk that goes 40% -> 100% in a few hours, long before 80% fires.
# RATE() = change per second; hours_left = (100 - used) / rate.
- name: "Predictive alarm: projected to fill within N hours"
  amazon.aws.cloudwatch_metric_alarm:
    state: present
    region: "{{ ansible_aws_ssm_region }}"
    profile: "{{ ansible_aws_ssm_profile }}"
    name: "{{ disk_alarm_prefix }}-FillRate-{{ inventory_hostname }}-{{ item.mount | regex_replace('[^A-Za-z0-9]', '_') }}"
    description: "{{ item.mount }} on {{ inventory_hostname }} projected to be full in < {{ disk_fill_rate_hours }}h"
    comparison: LessThanThreshold
    threshold: "{{ disk_fill_rate_hours }}"
    evaluation_periods: 3
    datapoints_to_alarm: 3
    treat_missing_data: notBreaching
    metrics:
      - id: used
        return_data: false
        metric_stat:
          period: "{{ disk_fill_rate_period }}"
          stat: Maximum
          metric:
            namespace: CWAgent
            metric_name: disk_used_percent
            dimensions:
              - { name: InstanceId, value: "{{ inventory_hostname }}" }
              - { name: path, value: "{{ item.mount }}" }
              - { name: fstype, value: "{{ item.fstype }}" }
      - id: rate
        expression: RATE(used)
        return_data: false
      - id: hours_left
        label: Hours until full
        expression: "IF(rate > 0, (100 - used) / (rate * 3600), 9999)"
        return_data: true
    alarm_actions: "{{ [alerts_topic_arn] if alerts_topic_arn else [] }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  loop: "{{ _mounts }}"
  loop_control:
    label: "{{ item.mount }}"
  when: disk_fill_rate_alarm_enabled | bool
